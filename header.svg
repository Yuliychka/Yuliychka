<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="100%" height="130">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
    
    .pixel-text {
      font-family: 'Press Start 2P', monospace, cursive;
      font-weight: bold;
      dominant-baseline: middle;
    }
    
    .c-black { fill: #111827; }
    .c-red { fill: #FF2E4C; }
    
    /* Support GitHub Dark Mode (black letters turn white on dark backgrounds) */
    @media (prefers-color-scheme: dark) {
      .c-black { fill: #FFFFFF; }
    }

    /* Typing Animation */
    .clip-rect-1 {
      animation: type1 4.5s steps(18, end) infinite alternate;
    }
    
    .clip-rect-2 {
      animation: type2 4.5s steps(9, end) infinite alternate;
    }

    @keyframes type1 {
      0%, 10% { width: 0px; }
      60%, 100% { width: 600px; }
    }

    @keyframes type2 {
      0%, 25% { width: 0px; }
      75%, 100% { width: 350px; }
    }
  </style>

  <defs>
    <clipPath id="clip1">
      <rect class="clip-rect-1" x="100" y="0" width="0" height="60" />
    </clipPath>
    <clipPath id="clip2">
      <rect class="clip-rect-2" x="250" y="60" width="0" height="70" />
    </clipPath>
  </defs>

  <!-- Line 1: Makhloufi Mohammed -->
  <g clip-path="url(#clip1)">
    <text x="120" y="35" class="pixel-text" font-size="20">
      <tspan class="c-black">M</tspan>
      <tspan class="c-red">a</tspan>
      <tspan class="c-black">k</tspan>
      <tspan class="c-red">h</tspan>
      <tspan class="c-black">l</tspan>
      <tspan class="c-red">o</tspan>
      <tspan class="c-black">u</tspan>
      <tspan class="c-red">f</tspan>
      <tspan class="c-black">i</tspan>
      <tspan> </tspan>
      <tspan class="c-red">M</tspan>
      <tspan class="c-black">o</tspan>
      <tspan class="c-red">h</tspan>
      <tspan class="c-black">a</tspan>
      <tspan class="c-red">m</tspan>
      <tspan class="c-black">m</tspan>
      <tspan class="c-red">e</tspan>
      <tspan class="c-black">d</tspan>
    </text>
  </g>

  <!-- Line 2: Yuliychka -->
  <g clip-path="url(#clip2)">
    <text x="260" y="90" class="pixel-text" font-size="16">
      <tspan class="c-black">Y</tspan>
      <tspan class="c-red">u</tspan>
      <tspan class="c-black">l</tspan>
      <tspan class="c-red">i</tspan>
      <tspan class="c-black">y</tspan>
      <tspan class="c-red">c</tspan>
      <tspan class="c-black">h</tspan>
      <tspan class="c-red">k</tspan>
      <tspan class="c-black">a</tspan>
    </text>
  </g>
</svg>
